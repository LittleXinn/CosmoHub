<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CosmoHub - Loading</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .loading-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 40px;
            z-index: 9999;
        }

        .blackhole-gif {
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        .loading-text {
            position: relative;
            z-index: 2;
            font-family: 'Inter', 'Segoe UI', sans-serif;
            font-size: 1.4rem;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.9);
            letter-spacing: 6px;
            text-transform: uppercase;
            animation: pulse 1.5s ease-in-out infinite;
            text-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
            margin-top: 260px;
        }

        .loading-dots::after {
            content: '';
            animation: dots 1.5s steps(4, end) infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.4; }
            50% { opacity: 1; }
        }

        @keyframes dots {
            0% { content: ''; }
            25% { content: '.'; }
            50% { content: '..'; }
            75% { content: '...'; }
            100% { content: ''; }
        }

        .fade-out {
            animation: fadeOut 0.8s ease forwards;
        }

        @keyframes fadeOut {
            to {
                opacity: 0;
                visibility: hidden;
            }
        }
    </style>
</head>
<body>
    <div class="loading-container" id="loader">
        <img src="assets/blackhole-loading.gif" alt="Loading" class="blackhole-gif">
        <p class="loading-text">Loading<span class="loading-dots"></span></p>
    </div>

    <script>
        setTimeout(function() {
            document.getElementById('loader').classList.add('fade-out');
            setTimeout(function() {
                window.location.href = 'LoginUI.html';
            }, 800);
        }, 3000);
    </script>
</body>
</html>
