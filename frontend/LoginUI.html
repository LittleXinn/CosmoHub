<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CosmoHub - Login</title>
    <link rel="stylesheet" href="LoginUI.css">
    <link rel="stylesheet" href="SigninUI.css">
<base target="_blank">
</head>
<body>
    <!-- Background GIF -->
    <div class="background-container">
        <img src="assets/background.gif" alt="Space Background" class="background-gif">
    </div>

    <!-- Login Page -->
    <div class="page active" id="login-page">
        <div class="left-panel">
            <div class="logo-section">
                <img src="assets/cosmohub-logo.png" alt="CosmoHub" class="logo-img">
                <p class="tagline">"Your Academic Universe"</p>
            </div>
            <div class="feature-list">
                <div class="feature-item">
                    <div class="feature-icon">
                        <img src="assets/icon-communicate.png" alt="Communicate">
                    </div>
                    <span>Communicate with people</span>
                </div>
                <div class="feature-item">
                    <div class="feature-icon">
                        <img src="assets/icon-build.png" alt="Build">
                    </div>
                    <span>Build Projects</span>
                </div>
                <div class="feature-item">
                    <div class="feature-icon">
                        <img src="assets/icon-learn.png" alt="Learn">
                    </div>
                    <span>Learn new things</span>
                </div>
            </div>
        </div>

        <div class="right-panel">
            <div class="glass-card">
                <h2 class="form-title">LOG IN</h2>
                <form id="login-form">
                    <div class="input-group">
                        <label for="login-email">Email</label>
                        <input type="email" id="login-email" placeholder="Example@gmail.com" required>
                    </div>
                    <div class="input-group">
                        <label for="login-password">Password</label>
                        <div class="password-wrapper">
                            <input type="password" id="login-password" placeholder="Abcd#1234" required>
                            <button type="button" class="toggle-password" onclick="togglePassword('login-password', this)">
                                <img src="assets/eye-off.png" alt="Show Password" class="eye-icon">
                            </button>
                        </div>
                    </div>
                    <a href="#" class="forgot-link">Forgot password?</a>
                    <button type="submit" class="submit-btn">LOG IN</button>
                </form>
                <p class="switch-text">Don't have an account? <a href="SignupUI.html" class="page-link" data-target="signup">Sign Up</a></p>
            </div>
        </div>
    </div>

    <!-- Sign Up Page (hidden by default) -->
    <div class="page" id="signup-page">
        <div class="left-panel">
            <div class="logo-section">
                <img src="assets/cosmohub-logo.png" alt="CosmoHub" class="logo-img">
                <p class="tagline">"Your Academic Universe"</p>
            </div>
            <div class="feature-list">
                <div class="feature-item">
                    <div class="feature-icon">
                        <img src="assets/icon-communicate.png" alt="Communicate">
                    </div>
                    <span>Communicate with people</span>
                </div>
                <div class="feature-item">
                    <div class="feature-icon">
                        <img src="assets/icon-build.png" alt="Build">
                    </div>
                    <span>Build Projects</span>
                </div>
                <div class="feature-item">
                    <div class="feature-icon">
                        <img src="assets/icon-learn.png" alt="Learn">
                    </div>
                    <span>Learn new things</span>
                </div>
            </div>
        </div>

        <div class="right-panel">
            <div class="glass-card signup-card">
                <h2 class="form-title">SIGN UP</h2>
                <form id="signup-form">
                    <div class="input-group">
                        <label for="signup-email">Email</label>
                        <input type="email" id="signup-email" placeholder="Example@gmail.com" required>
                    </div>
                    <div class="input-group">
                        <label for="signup-username">Username</label>
                        <input type="text" id="signup-username" placeholder="User123" required>
                    </div>
                    <div class="input-group">
                        <label for="signup-password">Password</label>
                        <div class="password-wrapper">
                            <input type="password" id="signup-password" placeholder="Abcd#1234" required>
                            <button type="button" class="toggle-password" onclick="togglePassword('signup-password', this)">
                                <img src="assets/eye-off.png" alt="Show Password" class="eye-icon">
                            </button>
                        </div>
                    </div>
                    <div class="input-group">
                        <label for="signup-confirm">Confirm Password</label>
                        <div class="password-wrapper">
                            <input type="password" id="signup-confirm" placeholder="Abcd#1234" required>
                            <button type="button" class="toggle-password" onclick="togglePassword('signup-confirm', this)">
                                <img src="assets/eye-off.png" alt="Show Password" class="eye-icon">
                            </button>
                        </div>
                    </div>
                    <button type="submit" class="submit-btn">SIGN UP</button>
                </form>
                <p class="switch-text">Already have an account? <a href="LoginUI.html" class="page-link" data-target="login">Login</a></p>
            </div>
        </div>
    </div>

    <script src="LoginUIscripts.js"></script>
    <script src="SigninUIscripts.js"></script>
    <script src="Transition.js"></script>
</body>
</html>
